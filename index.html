<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>캡슐 가챠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  color-scheme: light;
  --ink:#5B4B7A; --ink-soft:#9083AA; --line:#EADFF3; --outline:#8A78B0;
  --paper:#FFFBF7; --card:#FFFFFF;
  --pink:#FFBDD3; --pink-deep:#F7A3C0; --pink-light:#FFDDE8;
  --lav:#D5C8F7; --lav-deep:#AE9CE8; --lav-dark:#8E7CCB;
  --mint:#C3EEDF; --mint-deep:#94D9C2;
  --butter:#FFE8A3; --butter-deep:#F7D272;
  --sky:#C3DDFF;
  --danger:#E0708F;
  --bg1:#FFEFF5; --bg2:#F4EEFF; --bg3:#EAF8F3; --hint:#FFFFFF; --accent:#F59AB9;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --d: min(300px, 78vw);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg1)}
body{
  min-height:100vh;
  background-color:var(--bg1);
  background-image:
    radial-gradient(rgba(255,255,255,.9) 1.5px, transparent 1.6px),
    linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
  background-size:22px 22px, 100% 100%;
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,label.drop:focus-within{outline:3px solid var(--lav-deep);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:10px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}

/* header */
.bar{width:100%;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding-block:6px}
.bar h1{margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.01em}
.bar h1 span{color:var(--accent)}
.round-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--outline);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--lav);touch-action:manipulation}
.round-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.round-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lav)}

/* ---------- machine ---------- */
.machine{width:var(--d);display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;margin-top:14px;position:relative}
.machine::after{content:"";position:absolute;bottom:-12px;left:6%;right:6%;height:18px;border-radius:50%;background:rgba(142,124,203,.22);filter:blur(4px);z-index:-1}
.hat{position:relative;width:34%;height:calc(var(--d) * .09);background:var(--pink);border:2.5px solid var(--outline);border-radius:999px 999px 8px 8px;margin-bottom:calc(var(--d) * -.02 - 6px);z-index:3;box-shadow:inset 0 5px 0 var(--pink-light)}
.hat::before{content:"";position:absolute;left:50%;top:-16px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--butter);border:2.5px solid var(--outline);box-shadow:inset -3px -3px 0 var(--butter-deep)}
.dome{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 58%, rgba(255,255,255,.75), rgba(240,234,255,.55) 62%, rgba(213,200,247,.6) 100%);
  border:2.5px solid var(--outline);
  box-shadow:0 0 0 7px var(--lav), 0 0 0 9.5px var(--outline), inset 0 -16px 28px rgba(142,124,203,.18);
  overflow:hidden; z-index:2}
.pile{position:absolute;inset:0}
.cap{position:absolute;width:calc(var(--d) * .19);aspect-ratio:1;border-radius:50%;
  translate:-50% -50%; rotate:var(--rot,0deg);
  background:linear-gradient(to bottom,var(--c) 0 50%, rgba(255,255,255,.9) 50% 100%);
  box-shadow: inset 0 0 0 2px rgba(138,120,176,.75), inset -4px -6px 0 rgba(138,120,176,.12), inset 4px 4px 0 rgba(255,255,255,.55)}
.cap::after{content:"";position:absolute;left:5%;right:5%;top:calc(50% - 1px);height:2px;background:rgba(138,120,176,.45)}
.pile.shaking .cap{animation:jig .14s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes jig{from{transform:translate(0,0)}to{transform:translate(var(--jx,3px),var(--jy,-6px))}}
.shine{position:absolute;left:15%;top:11%;width:28%;height:18%;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,255,255,0));transform:rotate(-26deg);pointer-events:none}
.shine2{position:absolute;right:16%;top:24%;width:7%;height:7%;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none}
.collar{width:62%;height:24px;background:var(--mint);border:2.5px solid var(--outline);border-radius:12px;margin-top:6px;z-index:3;box-shadow:inset 0 -5px 0 var(--mint-deep)}
.mbody{position:relative;width:92%;margin-top:-6px;background:var(--pink);border:2.5px solid var(--outline);border-radius:30px 30px 22px 22px;padding:22px 16px 16px;
  box-shadow:inset 0 7px 0 var(--pink-light), inset 0 -9px 0 var(--pink-deep);display:grid;grid-template-columns:1fr auto;gap:12px 14px;align-items:center}
.sticker{position:absolute;width:18px;height:18px;clip-path:polygon(50% 0,63% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,37% 35%)}
.sticker.s1{left:12px;top:10px;background:var(--butter)}
.sticker.s2{right:18px;bottom:108px;width:13px;height:13px;background:#fff}
.plate{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:2px solid var(--outline);border-radius:12px;padding:3px 12px;font-family:var(--display);font-size:15px}
.plate .heart{color:var(--accent)}
.plate .no{color:var(--ink-soft);font-size:13px;font-variant-numeric:tabular-nums}
.slot-wrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.slot{width:50px;height:38px;background:var(--paper);border:2px solid var(--outline);border-radius:10px;display:grid;place-items:center}
.slot::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--lav-deep)}
.turn-hint{font-family:var(--display);color:var(--hint);font-size:15px;line-height:1.25;text-shadow:0 1.5px 0 var(--pink-deep)}
.slot{position:relative}
.coin-lane{position:absolute;left:50%;bottom:50%;width:80px;height:130px;margin-left:-40px;overflow:hidden;pointer-events:none;perspective:260px;z-index:4}
.coin{position:absolute;left:50%;bottom:0;width:36px;height:36px;margin-left:-18px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 35% 30%,#FFF6C9,#FFE08A 55%,#F2C552);border:2.5px solid #C99A2E;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);
  display:grid;place-items:center;color:#C99A2E;font-size:15px;line-height:1;font-family:var(--display)}
.coin.go{animation:coinIn .8s cubic-bezier(.45,.05,.55,1) forwards}
@keyframes coinIn{
  0%{opacity:0;transform:translateY(-96px) rotateY(0) scale(.8)}
  14%{opacity:1;transform:translateY(-88px) rotateY(0) scale(1)}
  48%{opacity:1;transform:translateY(-44px) rotateY(0)}
  70%{opacity:1;transform:translateY(-14px) rotateY(82deg)}
  100%{opacity:1;transform:translateY(46px) rotateY(88deg)}}
.slot.lit::before{background:var(--butter-deep);box-shadow:0 0 10px var(--butter)}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px 8px;cursor:pointer;font-size:12px;color:var(--ink)}
.swatch[aria-pressed="true"]{border-color:var(--outline);box-shadow:0 0 0 2px var(--outline) inset}
.swatch .mini{width:34px;height:34px;border-radius:50%;border:2px solid var(--o);background:linear-gradient(to bottom,var(--m) 0 50%,var(--r) 50% 100%);position:relative}
.swatch .mini::after{content:"";position:absolute;left:3px;right:3px;top:calc(50% - 1px);height:2px;background:var(--o);opacity:.5}
.handle{width:84px;height:84px;border-radius:50%;border:2.5px solid var(--outline);background:var(--butter);cursor:pointer;padding:0;display:grid;place-items:center;
  box-shadow:inset 0 -6px 0 var(--butter-deep), 0 4px 0 rgba(138,120,176,.35);touch-action:manipulation}
.handle .knob{width:100%;height:100%;display:grid;place-items:center;transition:transform .95s cubic-bezier(.4,.1,.3,1)}
.handle .bar-h{width:74%;height:22px;border-radius:11px;background:#fff;border:2.5px solid var(--outline);position:relative}
.handle .bar-h::after{content:"";position:absolute;right:5px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--pink-deep)}
.handle:active{box-shadow:inset 0 -3px 0 var(--butter-deep), 0 2px 0 rgba(138,120,176,.35)}
.handle[disabled]{cursor:progress}
.chute{grid-column:1 / -1;position:relative;height:88px;background:linear-gradient(180deg,var(--lav-dark),var(--lav-deep));border:2.5px solid var(--outline);border-radius:18px;overflow:hidden;box-shadow:inset 0 10px 14px rgba(70,50,120,.35)}
.flap{position:absolute;left:0;right:0;top:0;height:28px;background:rgba(255,255,255,.35);border-bottom:2px solid rgba(255,255,255,.6);transform-origin:top;transition:transform .25s}
.chute.dropping .flap{transform:rotateX(70deg)}
.chute-label{position:absolute;right:12px;bottom:6px;font-size:11px;color:rgba(255,255,255,.8)}
.out-cap{position:absolute;left:50%;bottom:9px;width:60px;height:60px;margin-left:-30px;border:0;padding:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(to bottom,var(--c) 0 50%, #fff 50% 100%);
  box-shadow: inset 0 0 0 2.5px var(--outline), inset -4px -6px 0 rgba(138,120,176,.12);display:none;touch-action:manipulation}
.out-cap::after{content:"";position:absolute;left:5%;right:5%;top:calc(50% - 1px);height:2px;background:rgba(138,120,176,.5)}
.out-cap.show{display:block;animation:drop .7s cubic-bezier(.3,.8,.4,1.2) both, beckon 1.4s 1s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-110px) rotate(-120deg)}70%{transform:translateY(4px) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes beckon{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}60%{transform:rotate(0)}}
.base{width:100%;height:22px;margin-top:-6px;background:var(--lav);border:2.5px solid var(--outline);border-radius:14px;box-shadow:inset 0 -5px 0 var(--lav-deep)}

.status{min-height:1.5em;text-align:center;font-size:14px;color:var(--ink-soft);margin-top:8px}
.status.warn{color:var(--danger)}

/* recent strip */
.recent{width:100%;background:rgba(255,255,255,.75);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.recent-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.recent-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:17px}
.recent-head span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.recent-row{display:grid;grid-template-columns:repeat(6,minmax(0,52px));align-items:center;gap:8px;min-height:52px;border:0;background:none;padding:0;cursor:pointer;width:100%;text-align:left}
.recent-row[disabled]{cursor:default}
.thumb-c{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 0 0 2px var(--c,var(--lav));background:var(--lav)}
.more-pill{width:100%;aspect-ratio:1;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--ink);letter-spacing:.1em}
.more-pill small{display:block;font-size:11px;letter-spacing:0;line-height:1;color:var(--ink-soft);font-family:var(--body)}
.recent-empty{grid-column:1 / -1;font-size:13px;color:var(--ink-soft)}
.recent-link{font-size:13px;color:var(--lav-dark);align-self:flex-end}

/* ---------- layers ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(74,60,110,0);transition:background .28s}
.scrim.open{background:rgba(74,60,110,.4)}
.drawer{position:absolute;background:var(--paper);display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:0 10px 40px rgba(74,60,110,.25)}
.drawer.left{top:0;bottom:0;left:0;width:min(420px,92vw);border-radius:0 26px 26px 0;transform:translateX(-102%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.bottom{left:0;right:0;bottom:0;max-height:88vh;margin:0 auto;max-width:520px;border-radius:26px 26px 0 0;transform:translateY(102%);padding-bottom:env(safe-area-inset-bottom,0px)}
.scrim.open .drawer{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.drawer-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.drawer-head .sub{font-size:13px;color:var(--ink-soft);margin-left:6px;font-family:var(--body)}
.drawer-body{overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.sec h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 span{font-family:var(--body);font-size:13px;color:var(--ink-soft)}
.notice{font-size:13px;background:var(--lav);background:rgba(213,200,247,.4);border-radius:12px;padding:8px 12px;color:var(--ink)}
.notice:empty{display:none}
label.drop{position:relative;display:flex;align-items:center;gap:12px;border:2px dashed var(--lav-deep);border-radius:18px;padding:16px;cursor:pointer;background:#fff;transition:background .15s,border-color .15s}
label.drop:hover,label.drop.over{background:var(--pink-light);border-color:var(--pink-deep)}
label.drop.disabled{opacity:.55;cursor:default;pointer-events:none}
label.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop .plus{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:24px;line-height:1;border:2px solid var(--outline);font-family:var(--display)}
.drop strong{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.drop small{display:block;color:var(--ink-soft);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{position:relative;aspect-ratio:1;background:var(--lav)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .dot{position:absolute;left:6px;top:6px;width:18px;height:18px;border-radius:50%;background:linear-gradient(to bottom,var(--c) 0 50%,#fff 50%);box-shadow:inset 0 0 0 1.5px var(--outline)}
.card .tag{position:absolute;right:6px;top:6px;font-size:10px;background:rgba(91,75,122,.75);color:#fff;border-radius:6px;padding:0 6px}
.card .meta{padding:4px 7px 6px;display:flex;flex-direction:column;gap:3px;align-items:center}
.card input.name{font:inherit;font-size:13px;width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:1px 0;color:var(--ink);min-width:0}
.card input.name:focus{border-color:var(--lav-deep);outline:none}
.card .name-static{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .del{font-size:12px;border:0;background:none;color:var(--ink-soft);cursor:pointer;padding:2px 0;text-align:left}
.card .confirm{display:flex;gap:4px;flex-wrap:wrap}
.card .confirm button{font-size:12px;border:1.5px solid var(--outline);border-radius:8px;background:#fff;padding:0 7px;cursor:pointer}
.card .confirm button.yes{background:var(--danger);border-color:var(--danger);color:#fff}
.card.placeholder .thumb{display:grid;place-items:center;color:var(--ink);font-size:12px;text-align:center}
.card.placeholder .thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.row-set{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.switch{position:relative;width:52px;height:30px;border-radius:15px;border:2px solid var(--outline);background:var(--line);cursor:pointer;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--outline);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.pill-btn{border:2px solid var(--outline);background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
.pill-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}

/* history sheet */
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1 1 130px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.stat{display:flex;align-items:center;gap:10px}
.stat img{flex:none;width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--c,var(--lav))}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;white-space:nowrap}
.stat span{font-size:12px;color:var(--ink-soft)}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hitem{border:0;padding:0;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.hitem .hthumb{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--c,var(--lav));border:2.5px solid #fff;box-shadow:0 0 0 2px var(--c,var(--lav))}
.hitem img{width:100%;height:100%;object-fit:cover;display:block}
.hitem .num{position:absolute;left:5px;bottom:5px;background:rgba(255,255,255,.9);border-radius:8px;padding:0 6px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink)}
.hitem .gone{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink);text-align:center;padding:6px}
.hitem .hname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .hdate{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hempty{font-size:14px;color:var(--ink-soft);text-align:center;padding:30px 0}

/* viewer + reveal */
.reveal,.viewer{position:fixed;inset:0;z-index:60;background:rgba(74,60,110,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.stage{position:relative;width:min(420px,100%);min-height:min(64vh,540px);display:grid;place-items:center}
.burst{position:absolute;left:50%;top:50%;width:130%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;opacity:0;transition:opacity .5s;pointer-events:none;
  background:conic-gradient(from 0deg,#FFD6E3,#FFE8A3,#C3EEDF,#C3DDFF,#D5C8F7,#FFD6E3);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 8s linear infinite}
.reveal[data-state="open"] .burst{opacity:.95}
@keyframes spin{to{rotate:360deg}}
.big-cap{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation}
.big-cap .half{position:absolute;left:0;width:100%;height:50%;border:3px solid var(--outline);transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .6s}
.big-cap .top{top:0;border-radius:85px 85px 0 0;border-bottom-width:1.5px;background:var(--c);box-shadow:inset 12px 12px 0 rgba(255,255,255,.45)}
.big-cap .bot{bottom:0;border-radius:0 0 85px 85px;border-top-width:1.5px;background:#fff;box-shadow:inset -10px -12px 0 rgba(138,120,176,.1)}
.reveal[data-state="closed"] .big-cap{animation:wobble 1.1s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(0)}}
.reveal[data-state="open"] .big-cap,.reveal[data-state="rolling"] .big-cap{pointer-events:none}

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PAL = ["#FFB5CC","#B8E8D8","#FFE3A3","#B9D7FF","#D6C6FF","#FFCBA8","#C8EFA9"];

  const LS = "oc-gacha-v2";
  // Each theme recolors the same machine: body (m), dome ring/chute/base (r), collar (c), handle (h), outline (o), page background (bg), hint text.
  const THEMES = {
    pink:   { label: "핑크", accent: "#F28DB2",   m: ["#FFBDD3","#F7A3C0","#FFDDE8"], r: ["#D5C8F7","#AE9CE8","#8E7CCB"], c: ["#C3EEDF","#94D9C2"], h: ["#FFE8A3","#F7D272"], o: "#8A78B0", bg: ["#FFEFF5","#F4EEFF","#EAF8F3"], hint: "#FFFFFF" },
    sky:    { label: "하늘색", accent: "#5E9CDB", m: ["#BCDDFF","#8FC0F2","#DDEEFF"], r: ["#D6E4FF","#A7BEF0","#7E98D6"], c: ["#FFE8A3","#F7D272"], h: ["#FFD1DF","#F4A8C0"], o: "#6F86B8", bg: ["#EAF5FF","#EEF1FF","#F3FBFF"], hint: "#FFFFFF" },
    green:  { label: "초록색", accent: "#4FAA70", m: ["#BDEAC8","#90D3A3","#DCF5E2"], r: ["#CDEFE5","#9AD6C3","#6DB5A0"], c: ["#FFE8A3","#F7D272"], h: ["#FFD1DF","#F4A8C0"], o: "#6E9C86", bg: ["#EEFAF1","#F4FAEA","#FFFBEF"], hint: "#FFFFFF" },
    red:    { label: "빨간색", accent: "#DD6464", m: ["#FFA3A3","#EE8080","#FFC8C8"], r: ["#FFD8C8","#F2B39A","#CF8577"], c: ["#FFF0C2","#F1D17A"], h: ["#FFFFFF","#EBDDDD"], o: "#A5646E", bg: ["#FFF0EE","#FFF5EC","#FFF9F3"], hint: "#FFFFFF" },
    purple: { label: "보라색", accent: "#9277D6", m: ["#D3C1F6","#B39BE9","#E7DCFB"], r: ["#F5D1E5","#E1A7C8","#C27DA4"], c: ["#C3EEDF","#94D9C2"], h: ["#FFE8A3","#F7D272"], o: "#7D68AC", bg: ["#F4EEFF","#FBEFFA","#EEF1FF"], hint: "#FFFFFF" },
    yellow: { label: "노란색", accent: "#DDA42F", m: ["#FFE29A","#F3C862","#FFF0C4"], r: ["#FFD0DE","#F2A8BF","#CE7B98"], c: ["#C3EEDF","#94D9C2"], h: ["#FFFFFF","#EFE6D6"], o: "#A2844F", bg: ["#FFFBEA","#FFF3F3","#F4FBF0"], hint: "#FFFFFF" },
    black:  { label: "검정색", accent: "#35323F", m: ["#4B4759","#35323F","#625D74"], r: ["#CFC8E0","#A69CC2","#3E3A4B"], c: ["#FFBDD3","#F2A0BD"], h: ["#FFE8A3","#F2CD6A"], o: "#2B2934", bg: ["#EFEDF4","#E8E6EF","#F4F2F8"], hint: "#FFFFFF" },
    white:  { label: "흰색", accent: "#EE93B1",   m: ["#FFFFFF","#E3E0EC","#FFFFFF"], r: ["#E8E5F1","#CDC7DD","#A49CBC"], c: ["#FFD6E3","#F4B6CB"], h: ["#FFE8A3","#F7D272"], o: "#8E86A8", bg: ["#F8F7FB","#F2F0F7","#FBFAFD"], hint: "#8E86A8" },
  };
  let themeKey = "pink";
  function applyTheme(key) {
    const t = THEMES[key] || THEMES.pink; themeKey = THEMES[key] ? key : "pink";
    const st = document.documentElement.style, set = (k, v) => st.setProperty(k, v);
    set("--pink", t.m[0]); set("--pink-deep", t.m[1]); set("--pink-light", t.m[2]);
    set("--lav", t.r[0]); set("--lav-deep", t.r[1]); set("--lav-dark", t.r[2]);
    set("--mint", t.c[0]); set("--mint-deep", t.c[1]);
    set("--butter", t.h[0]); set("--butter-deep", t.h[1]);
    set("--outline", t.o); set("--bg1", t.bg[0]); set("--bg2", t.bg[1]); set("--bg3", t.bg[2]); set("--hint", t.hint); set("--accent", t.accent);

  }
  function renderSwatches() {
    const box = document.getElementById("swatches"); if (!box) return; box.innerHTML = "";
    Object.entries(THEMES).forEach(([k, t]) => {

      b.innerHTML = `<span class="mini" style="--m:${t.m[0]};--r:${t.r[0]};--o:${t.o}"></span><span>${t.label}</span>`;
      b.onclick = () => chooseTheme(k);
      box.append(b);

  }
  const MAXH = 1500, RECENT_N = 5;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const state = {
    mode: "loading", items: [], local: [], samples: [],
    uploading: 0, busy: false, pending: null, confirmId: null, confirmClear: false, confirmWipe: false, wiping: false,
    history: [], total: 0, muted: false, renderQueued: false,
  };
  let db = null, assets = null, histDoc = null, setDoc = null;

  // ---------- local prefs / fallback history ----------
  try { const s = JSON.parse(localStorage.getItem(LS) || "{}"); state.muted = !!s.muted; if (s.theme) themeKey = s.theme; if (Array.isArray(s.history)) { state.history = s.history; state.total = s.total | 0; } } catch {}
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify({ muted: state.muted, theme: themeKey, history: histDoc ? [] : state.history, total: histDoc ? 0 : state.total })); } catch {} };

  // ---------- helpers ----------
  const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const colorFor = id => PAL[hash(id) % PAL.length];
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const real = () => state.mode === "local" ? state.local : state.items;
  const pool = () => real().length ? real() : state.samples;
  const usingSamples = () => real().length === 0;
  const canEdit = () => state.mode === "full" || state.mode === "local";
  const setStatus = (msg, warn) => { const s = $("status"); s.textContent = msg || ""; s.classList.toggle("warn", !!warn); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const byId = () => new Map([...state.items, ...state.local, ...state.samples].map(it => [it.id, it]));
  const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

  // ---------- sound ----------
  let ac = null, out = null;
  const audio = () => {
    if (state.muted) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (!out) { out = ac.createDynamicsCompressor(); out.threshold.value = -14; out.ratio.value = 6; out.connect(ac.destination); }
      if (ac.state === "suspended") ac.resume();
      return ac;
    } catch { return null; }
  };
  function tick(at) {
    const a = audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * .03), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = 2800; f.Q.value = 1.2; g.gain.value = .4;
    src.connect(f).connect(g).connect(out); src.start(a.currentTime + at);
  }
  function tone(freq, at, dur, type = "sine", vol = .16, slideTo) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + .05);

  // ---------- render: machine ----------
  function renderPile() {

    const r = rng(items.length * 7 + 3);

        const x = count === 1 ? 50 : 50 - half + i * (2 * half / (count - 1));

  async function initCaps() {

      state.items = snap.docs.map(d => { const v = d.data() || {}; return { id: d.id, assetId: v.assetId, name: String(v.name || "이름 없는 캡슐"), color: colorFor(d.id), src: "/_blob/" + v.assetId }; }).filter(it => it.assetId);

  const ERR = {

  async function prepare(file) {
    const ok = ["image/png", "image/jpeg", "image/webp", "image/gif"];
    if (file.type === "image/gif") return file;
    if (ok.includes(file.type) && file.size < 1.8e6) return file;
    let bmp; try { bmp = await createImageBitmap(file); } catch { return file; }
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/webp", .9));
    return (blob && blob.type === "image/webp") ? blob : await new Promise(r => c.toBlob(r, "image/jpeg", .9));
  }

  async function addFiles(files) {

    state.uploading += files.length; renderCards(); setStatus("");
    let failed = 0, lastErr = null; const base = Date.now();
    for (let i = 0; i < files.length; i++) {
      const f = files[i]; const name = f.name.replace(/\.[^.]+$/, "").slice(0, 40) || "새 캡슐";
      try {
        const blob = await prepare(f);
        if (state.mode === "full") {

          await db.collection("capsules").doc().set({ assetId: res.id, name, createdAt: base + i });
        } else {
          const id = "local-" + base + "-" + i;
          state.local.push({ id, name, color: colorFor(id), src: URL.createObjectURL(blob) });

    else setStatus(`${files.length}장을 캡슐에 넣었어요.`);
  }

  function openViewer(it, meta) {
    $("vImg").src = it.src; $("vImg").alt = "뽑은 사진"; $("vMeta").textContent = meta || "";
    $("vFrame").style.setProperty("--c", it.color); $("viewer").hidden = false; $("vClose").focus();
  }
  $("vClose").onclick = () => { $("viewer").hidden = true; };
  $("viewer").addEventListener("click", e => { if (e.target === $("viewer")) $("viewer").hidden = true; });

  // ---------- upload UI ----------
  $("fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

  // ---------- squishy photo (tap to boing) ----------
  function boing() {
    const a = audio(); if (!a) return;
    const k = .9 + Math.random() * .25, t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(260 * k, t); o.frequency.exponentialRampToValueAtTime(820 * k, t + .09);
    o.frequency.exponentialRampToValueAtTime(520 * k, t + .22);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + .26);
    o.connect(g).connect(out); o.start(t); o.stop(t + .3);
  }
  function jelly(el) {
    el.classList.remove("jelly"); void el.offsetWidth; el.classList.add("jelly"); boing();
  }
  $("prizeFrame").addEventListener("click", e => { if ($("reveal").dataset.state === "open") jelly(e.currentTarget); });
  $("vFrame").addEventListener("click", e => jelly(e.currentTarget));
  ["prizeFrame", "vFrame"].forEach(id => $(id).addEventListener("animationend", e => e.currentTarget.classList.remove("jelly")));

  // ---------- confetti behind the photo ----------
  const CONF = ["#FFB5CC","#FFE3A3","#B8E8D8","#B9D7FF","#D6C6FF","#FFCBA8","#FFFFFF","#F7A3C0","#F7D272","#94D9C2"];
  const fx = { cv: $("fx"), parts: [], raf: 0, rainUntil: 0, dpr: 1 };
  function fxResize() { const c = fx.cv, r = c.getBoundingClientRect(); fx.dpr = Math.min(2, window.devicePixelRatio || 1); c.width = Math.round(r.width * fx.dpr); c.height = Math.round(r.height * fx.dpr); }
  function spawn(x, y, vx, vy) {
    if (fx.parts.length > 520) return;
    fx.parts.push({ x, y, vx, vy, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 7, shape: Math.floor(Math.random() * 4), c: CONF[Math.floor(Math.random() * CONF.length)], wob: Math.random() * 6.28, life: 0 });
  }
  function starPath(x, r) { x.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } x.closePath(); }
  function heartPath(x, r) { x.beginPath(); x.moveTo(0, r * .35); x.bezierCurveTo(-r * 1.1, -r * .4, -r * .4, -r * 1.1, 0, -r * .45); x.bezierCurveTo(r * .4, -r * 1.1, r * 1.1, -r * .4, 0, r * .35); x.closePath(); }
  function confettiBurst() {
    fxResize();
    const rv = $("reveal").getBoundingClientRect(), st = document.querySelector(".reveal .stage").getBoundingClientRect();
    const cx = st.left + st.width / 2 - rv.left, cy = st.top + st.height / 2 - rv.top, w = rv.width, h = rv.height;
    const n = reduced ? 40 : 170;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 11; spawn(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp - 3); }
    if (!reduced) setTimeout(() => { for (let i = 0; i < 55; i++) { spawn(-5, h * .85, 5 + Math.random() * 8, -(9 + Math.random() * 9)); spawn(w + 5, h * .85, -(5 + Math.random() * 8), -(9 + Math.random() * 9)); } }, 180);
    fx.rainUntil = performance.now() + (reduced ? 0 : 2600);
    if (!fx.raf) fx.raf = requestAnimationFrame(fxLoop);
  }
  function fxLoop(now) {
    const c = fx.cv, x = c.getContext("2d"), d = fx.dpr, w = c.width / d, h = c.height / d;
    x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
    if (now < fx.rainUntil && Math.random() < .7) spawn(Math.random() * w, -12, (Math.random() - .5) * 1.5, 1.5 + Math.random() * 2);
    fx.parts = fx.parts.filter(p => p.y < h + 30 && p.life < 700);
    for (const p of fx.parts) {
      p.vx *= .985; p.vy = p.vy * .985 + .17; p.wob += .12;
      p.x += p.vx + Math.sin(p.wob) * .7; p.y += p.vy; p.rot += p.vr; p.life++;
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.fillStyle = p.c;
      if (p.shape === 0) { x.scale(1, Math.abs(Math.cos(p.wob))); x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      else if (p.shape === 1) { x.beginPath(); x.arc(0, 0, p.s * .35, 0, 7); x.fill(); }
      else if (p.shape === 2) { starPath(x, p.s * .6); x.fill(); }
      else { heartPath(x, p.s * .55); x.fill(); }
      x.restore();
    }
    if (fx.parts.length || now < fx.rainUntil) fx.raf = requestAnimationFrame(fxLoop);
    else { fx.raf = 0; x.clearRect(0, 0, w, h); }
  }
  function fxStop() { fx.parts = []; fx.rainUntil = 0; }

  // ---------- the pull (every photo has the same chance) ----------
  let angle = 0;
  async function spin() {
    if (state.busy) return;
    if (state.pending) { openReveal(); return; }
    const items = pool(); if (!items.length) return;
    state.busy = true; $("handle").disabled = true; setStatus("");
    const result = items[Math.floor(Math.random() * items.length)];
    // 1) insert a coin
    const coin = $("coin"), slot = $("slot");
    coin.classList.remove("go"); void coin.offsetWidth; coin.classList.add("go");
    tone(2100, 0, .1, "sine", .08); tone(2900, .05, .08, "sine", .05);
    await wait(reduced ? 100 : 600);
    tone(1500, 0, .09, "triangle", .12); tone(1900, .09, .09, "triangle", .1); tone(1250, .2, .12, "triangle", .08);
    slot.classList.add("lit");
    await wait(reduced ? 50 : 320);
    slot.classList.remove("lit");
    // 2) turn the handle
    angle += 360; $("knob").style.transform = `rotate(${angle}deg)`;
    for (let i = 0; i < 9; i++) tick(i * .1);
    $("pile").classList.add("shaking");
    await wait(reduced ? 150 : 950);
    $("pile").classList.remove("shaking");
    const chute = $("chute"), out = $("outCap");
    chute.classList.add("dropping");
    out.style.setProperty("--c", result.color);
    out.classList.remove("show"); void out.offsetWidth; out.classList.add("show");
    setTimeout(pop, reduced ? 0 : 380);
    await wait(500); chute.classList.remove("dropping");
    state.pending = result; state.busy = false; $("handle").disabled = false;
    setStatus("캡슐이 나왔어요! 눌러서 열어보세요.");
  }
  function openReveal() {
    const it = state.pending; if (!it) return;
    const rv = $("reveal"); rv.dataset.state = "closed";
    $("bigCap").style.setProperty("--c", it.color);
    $("prizeFrame").style.setProperty("--c", it.color);
    $("prizeImg").src = it.src; $("prizeImg").alt = "뽑은 사진";
    $("prizeMeta").textContent = it.sample ? "샘플 캡슐은 기록되지 않아요" : `${state.total + 1}번째 뽑기`;
    $("sparkles").innerHTML = "";
    rv.hidden = false; $("bigCap").focus();
  }
  async function crack() {
    const rv = $("reveal"), it = state.pending; if (!it || rv.dataset.state !== "closed") return;
    rv.dataset.state = "rolling";
    const roll = reduced ? .4 : 1.5;
    drumroll(roll);
    await wait(roll * 1000);
    rv.dataset.state = "open";
    crash(); pop(); setTimeout(fanfare, 90);
    setTimeout(() => { tone(1568, 0, .18, "sine", .1); tone(2093, .13, .45, "sine", .1, 2349); }, reduced ? 0 : 760);
    confettiBurst();
    const sp = $("sparkles");
    for (let i = 0; i < 16; i++) { const s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%"; s.style.animationDelay = (Math.random() * 1.6).toFixed(2) + "s"; const z = 7 + Math.random() * 12; s.style.width = s.style.height = z + "px"; s.style.background = SPARK[i % SPARK.length]; sp.append(s); }
    $("outCap").classList.remove("show"); state.pending = null;
    if (!it.sample) { try { recordPull(it); } catch (e) { setStatus("기록을 저장하지 못했어요.", true); } } else setStatus("왼쪽 위 설정에서 사진을 넣어보세요.");
    if (!it.sample) setStatus("");
    setTimeout(() => $("againBtn").focus(), 700);
  }
  function closeReveal() { $("reveal").hidden = true; fxStop(); }

  $("handle").addEventListener("click", spin);
  $("outCap").addEventListener("click", openReveal);
  $("bigCap").addEventListener("click", crack);
  $("closeBtn").addEventListener("click", closeReveal);
  $("againBtn").addEventListener("click", () => { closeReveal(); spin(); });
  $("reveal").addEventListener("click", e => { if (e.target === $("reveal") && $("reveal").dataset.state === "open") closeReveal(); });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("viewer").hidden) $("viewer").hidden = true;
    else if (!$("reveal").hidden) closeReveal();
    else if (!$("histScrim").hidden) closeLayer($("histScrim"));
    else if (!$("settingsScrim").hidden) closeLayer($("settingsScrim"));
  });

  // ---------- sound toggles ----------
  function syncMute() {
    $("soundSwitch").setAttribute("aria-checked", String(!state.muted));
    $("muteBtn").setAttribute("aria-label", state.muted ? "소리 켜기" : "소리 끄기");
    $("waves").style.display = state.muted ? "none" : ""; $("xmark").style.display = state.muted ? "" : "none";
  }
  const toggleMute = () => { state.muted = !state.muted; syncMute(); saveLocal(); };
  $("muteBtn").onclick = toggleMute; $("soundSwitch").onclick = toggleMute;
  syncMute();

  function chooseTheme(k) {
    applyTheme(k); saveLocal();
    if (setDoc) setDoc.set({ theme: k }).catch(() => {});
  }

  // ---------- boot ----------
  applyTheme(themeKey);
  buildSamples(); renderAll();
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, wait(1500)]) : Promise.resolve();
  fontsReady.then(() => { buildSamples(); renderAll(); });
  initCaps();
})();
</script>

</body></html>
